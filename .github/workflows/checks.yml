name: Проверки Django и PostgreSQL
on: [push, pull_request]
jobs:
  postgresql:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-trixie
        env:
          POSTGRES_PASSWORD: ci-admin-only
          POSTGRES_DB: monitor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d monitor"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_ENGINE: postgresql
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: monitor
      POSTGRES_APP_USER: monitor_ci
      POSTGRES_APP_PASSWORD: ci-app-only
      DJANGO_SECRET_KEY: ci-test-only-key
      PGPASSWORD: ci-admin-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Separate non-superuser CI role (CREATEDB is needed only by the test runner)
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE monitor_ci LOGIN NOSUPERUSER CREATEDB NOCREATEROLE PASSWORD 'ci-app-only';"
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "ALTER DATABASE monitor OWNER TO monitor_ci;"
      - run: python manage.py collectstatic --noinput
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test monitor --verbosity 2
  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral CI secrets
        run: |
          python - <<'PY'
          import secrets
          from pathlib import Path
          Path('.env').write_text(''.join(f'{key}={secrets.token_urlsafe(48)}\n' for key in ['DJANGO_SECRET_KEY','POSTGRES_ADMIN_PASSWORD','POSTGRES_APP_PASSWORD']))
          PY
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait app
      - name: Transfer actual SQLite database with independent backup and full-row checks
        run: |
          mkdir -p transfer
          chmod 777 transfer
          docker compose run --rm --no-deps -v "$PWD:/legacy:ro" -v "$PWD/transfer:/transfer" app python manage.py transfer_sqlite --source /legacy/db.sqlite3 --media-source /legacy/data --backup-dir /transfer
          docker compose run --rm --no-deps app python manage.py setup_roles
          python scripts/backup.py --output backups/ci
          python scripts/restore.py --backup backups/ci --database monitor_restore_check
      - name: Preserve rows/files across container recreation
        run: |
          docker compose run --rm --no-deps app python manage.py db_fingerprint --check-files > before.json
          docker compose up -d --force-recreate --wait app
          docker compose run --rm --no-deps app python manage.py db_fingerprint --check-files > after.json
          diff before.json after.json
          curl --fail --retry 5 http://127.0.0.1:8000/healthz/
      - name: Logs
        if: always()
        run: docker compose logs --no-color
