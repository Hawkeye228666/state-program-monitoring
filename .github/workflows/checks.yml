name: PostgreSQL and Compose checks
on: [push, pull_request]
jobs:
  windows-startup:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python scripts/check_startup.py
  postgresql:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-trixie
        env:
          POSTGRES_PASSWORD: ci-admin-only
          POSTGRES_DB: monitor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d monitor"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_ENGINE: postgresql
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: monitor
      POSTGRES_APP_USER: monitor_ci
      POSTGRES_APP_PASSWORD: ci-app-only
      DJANGO_SECRET_KEY: ci-test-only-key
      PGPASSWORD: ci-admin-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_repository.py
      - run: pip install -r requirements.txt
      - name: Separate non-superuser CI role (CREATEDB is needed only by the test runner)
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE monitor_ci LOGIN NOSUPERUSER CREATEDB NOCREATEROLE PASSWORD 'ci-app-only';"
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "ALTER DATABASE monitor OWNER TO monitor_ci;"
      - run: python manage.py collectstatic --noinput
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test monitor --verbosity 2
  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify fresh ZIP configuration and Windows-compatible generator
        run: python scripts/check_startup.py
      - name: First start without a pre-created .env (real Compose)
        shell: pwsh
        run: ./scripts/start.ps1 -NoBrowser -SkipAdmin
      - name: Repeat launcher preserves credentials, data and metadata
        shell: pwsh
        run: |
          $before = (Get-FileHash .env).Hash
          docker compose exec -T app python manage.py db_fingerprint --check-files > first-start.json
          ./scripts/start.ps1 -NoBrowser -SkipAdmin
          if ((Get-FileHash .env).Hash -ne $before) { throw 'Credentials changed' }
          docker compose exec -T app python manage.py db_fingerprint --check-files > second-start.json
          if ((Get-FileHash first-start.json).Hash -ne (Get-FileHash second-start.json).Hash) { throw 'Data changed' }
      - name: Verify unprivileged process, static serving and clean Gunicorn startup
        run: |
          docker compose exec -T app python -c "import os; assert os.geteuid() == 10001"
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8000/static/monitor/app.css
          docker compose logs --no-color app > app.log
          python -c "from pathlib import Path; assert 'Control server error' not in Path('app.log').read_text()"
      - name: Recover a new ZIP environment with an existing PostgreSQL volume
        run: |
          docker compose exec -T app python manage.py db_fingerprint --check-files > before-credentials.json
          python - <<'PY'
          from pathlib import Path
          import subprocess
          values=dict(line.split('=',1) for line in Path('.env').read_text().splitlines() if '=' in line and not line.startswith('#'))
          Path('.env').unlink()
          subprocess.run(['python','scripts/create_env.py'],check=True)
          subprocess.run(['pwsh','-NoProfile','-File','scripts/start.ps1','-NoBrowser','-SkipAdmin'],check=True)
          # The old app password must stop working after synchronization.
          result=subprocess.run(['docker','compose','exec','-T','-e','PGPASSWORD='+values['POSTGRES_APP_PASSWORD'],'db','psql','-h','127.0.0.1','-U','monitor_app','-d','monitor','-c','SELECT 1'],capture_output=True)
          assert result.returncode != 0, 'Old app password still accepted'
          PY
          docker compose exec -T app python manage.py db_fingerprint --check-files > after-credentials.json
          diff before-credentials.json after-credentials.json
          docker compose exec -T db psql -U postgres -d monitor -tAc "SELECT NOT rolsuper AND NOT rolcreatedb AND NOT rolcreaterole FROM pg_roles WHERE rolname='monitor_app'" | grep -x t
      - name: Explicit first setup and idempotent source loading
        run: |
          docker compose exec -T app python manage.py bootstrap_postgres --load-data
          docker compose exec -T app python manage.py bootstrap_postgres --load-data
          docker compose exec -T app python manage.py shell -c "from monitor.models import Observation; assert Observation.objects.count()==6792"
          python scripts/backup.py --output backups/ci
          python scripts/restore.py --backup backups/ci --database monitor_restore_check
      - name: Preserve rows/files across container recreation
        run: |
          docker compose run --rm --no-deps app python manage.py db_fingerprint --check-files > before.json
          docker compose up -d --force-recreate --wait app
          docker compose run --rm --no-deps app python manage.py db_fingerprint --check-files > after.json
          diff before.json after.json
          curl --fail --retry 5 http://127.0.0.1:8000/healthz/
      - name: Logs
        if: always()
        run: docker compose logs --no-color
