name: state-program-monitoring

x-app: &app
  build: .
  image: state-program-monitoring:local
  environment:
    DB_ENGINE: postgresql
    POSTGRES_DB: ${POSTGRES_DB:-monitor}
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    POSTGRES_APP_USER: ${POSTGRES_APP_USER:-monitor_app}
    POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
    DJANGO_DEBUG: "0"
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
    DJANGO_COOKIE_SECURE: ${DJANGO_COOKIE_SECURE:-0}
    DJANGO_SSL_REDIRECT: ${DJANGO_SSL_REDIRECT:-0}
    DJANGO_TRUST_PROXY_SSL: ${DJANGO_TRUST_PROXY_SSL:-0}
    MONITOR_MEDIA_ROOT: /app/data
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
  volumes:
    - sources:/app/data
  read_only: true
  tmpfs:
    - /tmp:uid=10001,gid=10001,mode=1770,size=67108864
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  db:
    image: postgres:17.11-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monitor}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-monitor_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-app.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
      - backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    # No host port: PostgreSQL is available only on the Compose network.

  migrate:
    <<: *app
    command: ["sh", "-c", "python manage.py wait_for_db && python manage.py migrate --noinput"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    <<: *app
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
  sources:
  backups:
